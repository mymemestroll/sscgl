<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Admin Panel</title>
    <link rel="stylesheet" href="gk-one-liner-admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-cogs"></i> JSON Admin Panel</h1>
            <div class="header-actions">
                <button id="importBtn" class="btn btn-secondary">
                    <i class="fas fa-upload"></i> Import JSON
                </button>
                <button id="downloadBtn" class="btn btn-primary">
                    <i class="fas fa-download"></i> Download
                </button>
                <button id="clearBtn" class="btn btn-warning">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </header>

        <!-- Import Section -->
        <div id="importSection" class="import-section" style="display: none;">
            <div class="import-box">
                <h3>Import JSON File</h3>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <textarea id="jsonTextArea" placeholder="Paste your JSON content here..." rows="8"></textarea>
                <div class="import-actions">
                    <button id="selectFileBtn" class="btn btn-secondary">
                        <i class="fas fa-file"></i> Select File
                    </button>
                    <button id="loadJsonBtn" class="btn btn-primary">
                        <i class="fas fa-check"></i> Load JSON
                    </button>
                    <button id="cancelImportBtn" class="btn btn-danger">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-layout">
            <!-- Left Panel - Editor -->
            <div class="editor-panel">
                <!-- Version Section -->
                <div class="section">
                    <h2><i class="fas fa-tag"></i> Version</h2>
                    <input type="text" id="version" placeholder="e.g., 1.0.3" class="form-control">
                </div>

                <!-- Content Sections -->
                <div class="section">
                    <div class="section-header">
                        <h2><i class="fas fa-list"></i> Content Sections</h2>
                        <button id="addSectionBtn" class="btn btn-success">
                            <i class="fas fa-plus"></i> Add Section
                        </button>
                    </div>
                    <div id="sectionsContainer"></div>
                </div>
            </div>

            <!-- Right Panel - JSON Visualizer -->
            <div class="visualizer-panel">
                <div class="visualizer-header">
                    <h3><i class="fas fa-code"></i> JSON Preview</h3>
                    <div class="visualizer-actions">
                        <div class="view-toggle">
                            <button id="rawViewBtn" class="active">Raw</button>
                            <button id="treeViewBtn">Tree</button>
                        </div>
                        <button id="formatJsonBtn" class="btn btn-secondary btn-small">
                            <i class="fas fa-magic"></i> Format
                        </button>
                        <button id="copyJsonBtn" class="btn btn-primary btn-small">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                </div>
                <div class="visualizer-content">
                    <pre id="jsonVisualizerPre"><code id="jsonVisualizer" class="json"></code></pre>
                    <div id="treeView" class="tree-view hidden"></div>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages"></div>
    </div>

    <script src="gk-one-liner-admin.js"></script>
</body>
</html>
